#cloud-config
# k3s agent node. cloud-init runs this file only at the first boot.
# components/cloud_init.py fills the placeholders.
write_files:
  - path: /etc/rancher/k3s/config.yaml
    permissions: "0600"
    content: |
      token: "@{token}"
      node-ip: "@{node_ip}"
      kubelet-arg: @{kubelet_args}
  - path: /usr/local/sbin/k3s-bootstrap.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Sets up the node and installs the k3s agent. Safe to run a second time.
      set -euxo pipefail
      exec >>/var/log/k3s-bootstrap.log 2>&1
      echo "k3s bootstrap start: $(date -Is)"

      # Swap: the node has 1 GB of RAM.
      if [ ! -f /swapfile ]; then
        fallocate -l @{swap_gb}G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
      fi
      swapon --show=NAME --noheadings | grep -qx /swapfile || swapon /swapfile
      grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab

      # The Ubuntu image rejects all inbound and forwarded traffic except SSH.
      # Insert the accept rules before the reject rules, then save them.
      accept() { iptables -C "$@" -j ACCEPT 2>/dev/null || iptables -I "$@" -j ACCEPT; }
      accept INPUT -s @{vcn_cidr}
      accept INPUT -s @{cluster_cidr}
      accept FORWARD -s @{cluster_cidr}
      accept FORWARD -d @{cluster_cidr}
      for port in 80 443; do
        accept INPUT -p tcp --dport "$port"
      done
      netfilter-persistent save

      # Install the k3s agent. It retries until the server node answers.
      # The token and the kubelet settings are in /etc/rancher/k3s/config.yaml.
      if ! systemctl is-active --quiet k3s-agent; then
        for attempt in 1 2 3 4 5; do
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="@{k3s_version}" K3S_URL="@{server_url}" sh -s - agent && break
          sleep 30
        done
      fi
      systemctl is-active k3s-agent
      echo "k3s bootstrap done: $(date -Is)"
runcmd:
  - [/usr/local/sbin/k3s-bootstrap.sh]
