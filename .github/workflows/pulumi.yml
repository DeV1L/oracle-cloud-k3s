name: pulumi stack default

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'pulumi/**'
      - '.github/workflows/pulumi.yml'
  workflow_dispatch:
    inputs:
      run_preview:
        description: 'preview'
        required: false
        default: true
        type: boolean
      run_apply:
        description: 'apply'
        required: false
        default: false
        type: boolean

# Only one run at a time touches the stack. A queued run waits; it is not cancelled.
concurrency:
  group: pulumi-stack-default
  cancel-in-progress: false

env:
  PULUMI_STACK: default
  PULUMI_VERSION: 3.268.0  # Pulumi CLI 3.256 and older cannot log in to the OCI state bucket (BadDigest).
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.TF_VAR_region }}
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required  # The OCI S3-compatible API sends no checksums.
  TF_VAR_tenancy_ocid: ${{ vars.TF_VAR_tenancy_ocid }}
  TF_VAR_user_ocid: ${{ vars.TF_VAR_user_ocid }}
  TF_VAR_fingerprint: ${{ vars.TF_VAR_fingerprint }}
  TF_VAR_region: ${{ vars.TF_VAR_region }}
  TF_VAR_private_key: ${{ secrets.TF_VAR_private_key }}

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_preview == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pulumi/requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7.0.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}

      - name: Cache Pulumi plugins
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/requirements.txt') }}

      - name: Install dependencies
        working-directory: pulumi/
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Configure Pulumi
        working-directory: pulumi/
        run: |
          source venv/bin/activate
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select "$PULUMI_STACK"

      - name: Pulumi Preview
        working-directory: pulumi/
        run: |
          source venv/bin/activate
          pulumi preview --diff

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: preview
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pulumi/requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7.0.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}

      - name: Cache Pulumi plugins
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/requirements.txt') }}

      - name: Install dependencies
        working-directory: pulumi/
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Configure Pulumi
        working-directory: pulumi/
        run: |
          source venv/bin/activate
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select "$PULUMI_STACK"

      - name: Pulumi Up
        working-directory: pulumi/
        run: |
          source venv/bin/activate
          pulumi up --yes

      - name: Stack Outputs
        if: always()
        working-directory: pulumi/
        run: |
          source venv/bin/activate
          pulumi stack output
